spring.application.name=esen-tienda-api
server.port=${PORT:8080}

# ---- Base de datos MySQL (por defecto: XAMPP / MySQL local, usuario root sin clave) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esen_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# En produccion se debe definir JWT_SECRET (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:esen-clave-solo-para-desarrollo-local-cambiar-en-produccion-2026}
app.jwt.access-minutes=30
app.jwt.refresh-days=7

# ---- CORS: origenes del frontend separados por coma (acepta comodines) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,https://*.vercel.app}

# ---- Usuarios de demostracion creados al iniciar con la base vacia ----
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123*}
app.seed.vendedor-password=${SEED_VENDEDOR_PASSWORD:Vendedor123*}
app.seed.cliente-password=${SEED_CLIENTE_PASSWORD:Cliente123*}

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
